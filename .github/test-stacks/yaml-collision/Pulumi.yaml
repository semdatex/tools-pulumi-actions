# Fork-only fixture: a stack whose own outputs are named `resource-changes`
# and `error-log`, used to assert that enabling the same-named inputs in
# per-key format fails instead of silently shadowing one of the two.
name: yamlcollision
runtime: yaml
outputs:
  resource-changes: not-the-actions-output
  error-log: not-the-actions-output-either

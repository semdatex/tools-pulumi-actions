# Reusable — called by pipeline.yml, which owns the triggers and the
# `Pipeline Complete` gate. See the note in test.yml on why there is no
# `paths-ignore` here.
name: 'Actions Workflow'
on:
  workflow_call:

jobs:
  install-and-build:
    name: Install and Build GHA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn

      - run: yarn install --frozen-lockfile

      - run: yarn build

      # Upstream ran dorny/paths-filter here with `base: HEAD` — its
      # "uncommitted changes" mode — so `changed` actually meant "the committed
      # dist/ is stale", and the whole e2e matrix below was gated on that. Once
      # test.yml enforces a fresh dist on every PR that becomes permanently
      # false and the matrix would silently never run again. Ask the real
      # question instead: did this PR touch anything that changes how the built
      # action behaves? Doing it in shell also means the fork needs no
      # third-party action, so it is not coupled to the org's Actions allowlist.
      - name: Detect relevant changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          RELEVANT='^(src|dist|scripts)/|^\.github/(workflows|test-stacks)/|^(action\.yml|package\.json|yarn\.lock|tsconfig\.json)$'

          # Fail open. Where we cannot establish a range — workflow_dispatch,
          # merge_group, a force-push, an API hiccup — run the full matrix rather
          # than skip it and report a false green.
          emit() { echo "dist=$1" >>"$GITHUB_OUTPUT"; }

          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "No pull-request range available; running the full matrix."
            emit true
            exit 0
          fi

          # The compare API avoids fetching history: this fork carries
          # pulumi/actions' full log, with a multi-megabyte dist blob on every
          # bot commit, so fetch-depth: 0 is expensive.
          if ! files=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BASE_SHA}...${HEAD_SHA}" \
              --paginate --jq '.files[].filename'); then
            echo "::warning::Could not compare ${BASE_SHA}...${HEAD_SHA}; running the full matrix."
            emit true
            exit 0
          fi

          echo "Changed files:"
          echo "$files" | sed 's/^/  /'

          if printf '%s\n' "$files" | grep -Eq "$RELEVANT"; then
            emit true
          else
            echo "Nothing that affects the built action changed."
            emit false
          fi

      - name: Upload artifacts
        if:
          steps.changes.outputs.dist == 'true' || github.event_name ==
          'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

    outputs:
      changed: ${{ steps.changes.outputs.dist }}

  test-install-only-without-removal-of-pre-installed-pulumi:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: Install-only without removal of pre-installed Pulumi on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # If no action is specified, just install.
      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          config-map: '{name: {value: my-pet, secret: false}}'

      - run: pulumi version

  test-install-only:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: Install-only on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Remove pre-installed Pulumi
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
        run: |
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then
            EXT=".exe"
          fi

          if command -v "pulumi${EXT}"; then
            PULUMI_INSTALL_DIR=$(dirname "$(command -v "pulumi${EXT}")")
            echo "Deleting Pulumi"
            rm -v "$PULUMI_INSTALL_DIR"/pulumi*
          fi

      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      # If no action is specified, just install.
      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          config-map: '{name: {value: my-pet, secret: false}}'

      - run: pulumi version

  test-dotnet-stack:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: Dotnet ${{ matrix.command }} on ${{ matrix.os }}
    strategy:
      matrix:
        command: [up, refresh, destroy, preview, output]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Remove pre-installed Pulumi
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
        run: |
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then
            EXT=".exe"
          fi

          if command -v "pulumi${EXT}"; then
            PULUMI_INSTALL_DIR=$(dirname "$(command -v "pulumi${EXT}")")
            echo "Deleting Pulumi"
            rm -v "$PULUMI_INSTALL_DIR"/pulumi*
          fi

      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 6.x

      - name: Ensure Stack Exists
        if: matrix.command == 'output'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          upsert: true
          stack-name: dev
          work-dir: .github/test-stacks/dotnet
          config-map: '{name: {value: my-pet, secret: false}}'

      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          upsert: true
          stack-name: dev
          work-dir: .github/test-stacks/dotnet
          config-map: '{name: {value: my-pet, secret: false}}'

      - name: Ensure Update Plan is Not Generated
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/dotnet
        run: |
          ! test -f update-plan.json || exit 1

      - name: Run Pulumi Preview with Update Plan
        if: matrix.command == 'preview'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/dotnet
          config-map: '{name: {value: hostname, secret: false}}'
          plan: update-plan.json

      - name: Ensure Update Plan is Generated and Not Empty
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/dotnet
        run: |
          test -s update-plan.json

  test-golang-stack:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: Golang ${{ matrix.command }} on ${{ matrix.os }}
    strategy:
      matrix:
        command: [up, refresh, destroy, preview, output]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Remove pre-installed Pulumi
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
        run: |
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then
            EXT=".exe"
          fi

          if command -v "pulumi${EXT}"; then
            PULUMI_INSTALL_DIR=$(dirname "$(command -v "pulumi${EXT}")")
            echo "Deleting Pulumi"
            rm -v "$PULUMI_INSTALL_DIR"/pulumi*
          fi

      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-go@v6
        with:
          go-version: oldstable

      - name: Ensure Stack Exists
        if: matrix.command == 'output'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          upsert: true
          stack-name: dev
          work-dir: .github/test-stacks/golang
          config-map: '{name: {value: my-user-name, secret: false}}'

      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: '{name: {value: my-user-name, secret: false}}'

      - name: Ensure Update Plan is Not Generated
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/golang
        run: |
          ! test -f update-plan.json || exit 1

      - name: Run Pulumi Preview with Update Plan
        if: matrix.command == 'preview'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: '{name: {value: hostname, secret: false}}'
          plan: update-plan.json

      - name: Ensure Update Plan is Generated and Not Empty
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/golang
        run: |
          test -s update-plan.json

  test-nodejs-stack:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: NodeJS ${{ matrix.command }} on ${{ matrix.os }}
    strategy:
      matrix:
        command: [up, refresh, destroy, preview, output]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Remove pre-installed Pulumi
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
        run: |
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then
            EXT=".exe"
          fi

          if command -v "pulumi${EXT}"; then
            PULUMI_INSTALL_DIR=$(dirname "$(command -v "pulumi${EXT}")")
            echo "Deleting Pulumi"
            rm -v "$PULUMI_INSTALL_DIR"/pulumi*
          fi

      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm install
        working-directory: .github/test-stacks/nodejs

      - name: Ensure Stack Exists
        if: matrix.command == 'output'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          upsert: true
          stack-name: dev
          work-dir: .github/test-stacks/nodejs
          config-map: '{name: {value: hostname, secret: false}}'

      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/nodejs
          config-map: '{name: {value: hostname, secret: false}}'

      - name: Ensure Update Plan is Not Generated
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/nodejs
        run: |
          ! test -f update-plan.json || exit 1

      - name: Run Pulumi Preview with Update Plan
        if: matrix.command == 'preview'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/nodejs
          config-map: '{name: {value: hostname, secret: false}}'
          plan: update-plan.json

      - name: Ensure Update Plan is Generated and Not Empty
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/nodejs
        run: |
          test -s update-plan.json


  test-python-stack:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: Python ${{ matrix.command }} on ${{ matrix.os }}
    strategy:
      matrix:
        command: [up, refresh, destroy, preview, output]
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Remove pre-installed Pulumi
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
        run: |
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then
            EXT=".exe"
          fi

          if command -v "pulumi${EXT}"; then
            PULUMI_INSTALL_DIR=$(dirname "$(command -v "pulumi${EXT}")")
            echo "Deleting Pulumi"
            rm -v "$PULUMI_INSTALL_DIR"/pulumi*
          fi

      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-python@v6.3.0
        with:
          python-version: 3.9

      - uses: actions/cache@v6
        if: startsWith(runner.os, 'Linux')
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/cache@v6
        if: startsWith(runner.os, 'macOS')
        with:
          path: ~/Library/Caches/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - uses: actions/cache@v6
        if: startsWith(runner.os, 'Windows')
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - run: python -m pip install -r requirements.txt
        working-directory: .github/test-stacks/python

      - name: Ensure Stack Exists
        if: matrix.command == 'output'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          upsert: true
          stack-name: dev
          work-dir: .github/test-stacks/python
          config-map: '{name: {value: hostname, secret: false}}'

      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/python
          config-map: '{name: {value: hostname, secret: false}}'

      - name: Ensure Update Plan is Not Generated
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/python
        run: |
          ! test -f update-plan.json || exit 1

      - name: Run Pulumi Preview with Update Plan
        if: matrix.command == 'preview'
        uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: ${{ matrix.command }}
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/python
          config-map: '{name: {value: hostname, secret: false}}'
          plan: update-plan.json

      - name: Ensure Update Plan is Generated and Not Empty
        shell: bash
        if: matrix.command == 'preview'
        working-directory: .github/test-stacks/python
        run: |
          test -s update-plan.json

  test-generic-inputs:
    needs: install-and-build
    if:
      ${{ needs.install-and-build.outputs.changed == 'true' || github.event_name
      == 'workflow_dispatch' }}
    runs-on: ${{ matrix.os }}
    name: Inputs on ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    steps:
      - name: Remove pre-installed Pulumi
        shell: bash
        env:
          RUNNER_OS: ${{ matrix.os }}
        run: |
          EXT=""
          if [ "$RUNNER_OS" == "Windows" ]; then
            EXT=".exe"
          fi

          if command -v "pulumi${EXT}"; then
            PULUMI_INSTALL_DIR=$(dirname "$(command -v "pulumi${EXT}")")
            echo "Deleting Pulumi"
            rm -v "$PULUMI_INSTALL_DIR"/pulumi*
          fi

      - uses: actions/checkout@v7

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm

      - run: npm install
        working-directory: .github/test-stacks/nodejs

      - uses: ./
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/nodejs
          upsert: true
          refresh: true
          config-map: '{name: {value: hostname, secret: false}}'

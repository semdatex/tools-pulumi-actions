# Reusable — called by pipeline.yml, which owns the triggers and the
# `Pipeline Complete` gate. Deliberately no `paths-ignore` here: a workflow whose
# jobs feed a required status check must never be filtered out of a run, or the
# context is reported as pending forever instead of skipped, and the PR can never
# merge.
name: 'build-test'
on:
  workflow_call:

# See the note in workflow.yml: test-output and test-update-plan drive the same
# golang test stack, so they need authenticated provider-plugin resolution too.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-test: # lint, typecheck, unit tests, and bundle integrity
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      # --frozen-lockfile: a bare `yarn install` may resolve differently and
      # rewrite the tracked yarn.lock, which the integrity check below would then
      # report as drift.
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # Build last, immediately before the integrity check, so the check covers
      # side effects of everything above it as well as a stale bundle. Upstream
      # rebuilt dist/ after the fact with a bot pushing to main; we require it in
      # the PR instead. See FORK.md.
      - run: yarn build
      - name: Check that none of these steps caused unstaged changes
        uses: semdatex/actions-check-git-unstaged@v1.0.0
  test-output: # make sure the action works on a clean machine without building
    name: Action Output Round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: oldstable
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/golang
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Run Pulumi Up
        uses: ./
        if: always()
        id: pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - run: echo 'The random string is `${{ steps.pulumi.outputs.name }}`'
      - name: Get Outputs
        uses: ./
        if: always()
        id: pulumioutput
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: output
          cloud-url: file://~
          stack-name: organization/golang/dev
      - run: echo 'The random string is `${{ steps.pulumioutput.outputs.name }}`'
      - name: Compare Outputs
        id: compare
        run: |
          if [[ "$OUTPUT1" != "$OUTPUT2" ]]; then
            echo "Outputs are not equal!"
            exit 1
          fi
        env:
          OUTPUT1: ${{ steps.pulumi.outputs.name }}
          OUTPUT2: ${{ steps.pulumioutput.outputs.name }}
  test-update-plan: # make sure the action works on a clean machine without building
    name: Action Update Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: oldstable
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/golang
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Generate Update Plan via Pulumi Preview
        uses: ./
        if: always()
        id: pulumi-preview
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          plan: /tmp/update-plan.json
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - name: Apply Update Plan via Pulumi Up
        uses: ./
        if: always()
        id: pulumi-up
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          plan: /tmp/update-plan.json
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - run: echo 'The random string is `${{ steps.pulumi-up.outputs.name }}`'

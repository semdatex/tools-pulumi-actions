# Reusable — called by pipeline.yml, which owns the triggers and the
# `Pipeline Complete` gate. Deliberately no `paths-ignore` here: a workflow whose
# jobs feed a required status check must never be filtered out of a run, or the
# context is reported as pending forever instead of skipped, and the PR can never
# merge.
name: 'build-test'
on:
  workflow_call:

# See the note in workflow.yml: test-output and test-update-plan drive the same
# golang test stack, so they need authenticated provider-plugin resolution too.
env:
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  build-test: # lint, typecheck, unit tests, and bundle integrity
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      # --frozen-lockfile: a bare `yarn install` may resolve differently and
      # rewrite the tracked yarn.lock, which the integrity check below would then
      # report as drift.
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn test
      # Build last, immediately before the integrity check, so the check covers
      # side effects of everything above it as well as a stale bundle. Upstream
      # rebuilt dist/ after the fact with a bot pushing to main; we require it in
      # the PR instead. See FORK.md.
      - run: yarn build
      - name: Check that none of these steps caused unstaged changes
        uses: semdatex/actions-check-git-unstaged@v1.0.0
  test-output: # make sure the action works on a clean machine without building
    name: Action Output Round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: oldstable
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/golang
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Run Pulumi Up
        uses: ./
        if: always()
        id: pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - run: echo 'The random string is `${{ steps.pulumi.outputs.name }}`'
      - name: Get Outputs
        uses: ./
        if: always()
        id: pulumioutput
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: output
          cloud-url: file://~
          stack-name: organization/golang/dev
      - run: echo 'The random string is `${{ steps.pulumioutput.outputs.name }}`'
      - name: Compare Outputs
        id: compare
        run: |
          if [[ "$OUTPUT1" != "$OUTPUT2" ]]; then
            echo "Outputs are not equal!"
            exit 1
          fi
        env:
          OUTPUT1: ${{ steps.pulumi.outputs.name }}
          OUTPUT2: ${{ steps.pulumioutput.outputs.name }}
  test-secret-outputs: # per-key outputs of secret values must keep upstream parity in both masking modes
    name: Secret Outputs Round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/yaml
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Run Pulumi Up (default nested masking)
        uses: ./
        id: pulumi
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml
          suppress-progress: true
      - name: Get Outputs (exact legacy masking)
        uses: ./
        if: always()
        id: pulumioutput
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: output
          cloud-url: file://~
          stack-name: organization/yamltest/dev
          secret-masking: exact
      - name: Assert per-key outputs kept the upstream contract
        run: |
          [[ "$PLAIN" == "hello" ]] || { echo "plain output broken"; exit 1; }
          [[ "$SECRET_UP" == "hush-hush-1234" ]] || { echo "secret output did not round-trip through up (nested masking)"; exit 1; }
          [[ "$SECRET_OUTPUT" == "hush-hush-1234" ]] || { echo "secret output did not round-trip through output (exact masking)"; exit 1; }
          [[ "$(echo "$STRUCTURED" | jq -r .password)" == "fixture-password-9876" ]] || { echo "structured secret output did not round-trip"; exit 1; }
        env:
          PLAIN: ${{ steps.pulumi.outputs.plain }}
          SECRET_UP: ${{ steps.pulumi.outputs.secretValue }}
          SECRET_OUTPUT: ${{ steps.pulumioutput.outputs.secretValue }}
          STRUCTURED: ${{ steps.pulumi.outputs.structuredSecret }}
      - name: Assert the json-mode outputs are absent in the default per-key format
        run: |
          [[ -z "$AGGREGATE_DEFAULT" ]] || { echo "stack-outputs must not be set with output-format: per-key"; exit 1; }
          [[ -z "$RESOURCE_CHANGES_DEFAULT" ]] || { echo "resource-changes must not be set with output-format: per-key"; exit 1; }
        env:
          AGGREGATE_DEFAULT: ${{ steps.pulumioutput.outputs['stack-outputs'] }}
          RESOURCE_CHANGES_DEFAULT: ${{ steps.pulumioutput.outputs.resource-changes }}
      - name: Get Outputs (output-format json)
        uses: ./
        if: always()
        id: pulumijson
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: output
          cloud-url: file://~
          stack-name: organization/yamltest/dev
          output-format: json
      - name: Assert json mode publishes the aggregate, never secrets or per-key outputs
        run: |
          [[ -z "$PER_KEY_PLAIN" ]] || { echo "per-key outputs must not be set in json mode"; exit 1; }
          [[ -z "$PER_KEY_SECRET" ]] || { echo "per-key secret output must not be set in json mode"; exit 1; }
          [[ -z "$RESOURCE_CHANGES" ]] || { echo "resource-changes must not be set when the resource-changes input is omitted: '$RESOURCE_CHANGES'"; exit 1; }
          jq -e '.plain.value == "hello" and .plain.secret == false' <<<"$AGGREGATE" >/dev/null || { echo "plain entry wrong"; exit 1; }
          jq -e '.secretValue.secret == true and (.secretValue | has("value") | not)' <<<"$AGGREGATE" >/dev/null || { echo "secret entry not excluded"; exit 1; }
          jq -e '.structuredSecret.secret == true and (.structuredSecret | has("value") | not)' <<<"$AGGREGATE" >/dev/null || { echo "structured secret entry not excluded"; exit 1; }
          grep -vq 'hush-hush-1234' <<<"$AGGREGATE" || { echo "aggregate leaked a secret value"; exit 1; }
          grep -vq 'fixture-password-9876' <<<"$AGGREGATE" || { echo "aggregate leaked a structured secret leaf"; exit 1; }
        env:
          PER_KEY_PLAIN: ${{ steps.pulumijson.outputs.plain }}
          PER_KEY_SECRET: ${{ steps.pulumijson.outputs.secretValue }}
          RESOURCE_CHANGES: ${{ steps.pulumijson.outputs.resource-changes }}
          AGGREGATE: ${{ steps.pulumijson.outputs['stack-outputs'] }}
      - name: Get Outputs (output-format json-with-secrets)
        uses: ./
        if: always()
        id: pulumijsonsecrets
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: output
          cloud-url: file://~
          stack-name: organization/yamltest/dev
          output-format: json-with-secrets
      - name: Assert json-with-secrets carries decrypted values and no per-key outputs
        run: |
          [[ -z "$PER_KEY_SECRET" ]] || { echo "per-key outputs must not be set in json-with-secrets mode"; exit 1; }
          [[ "$(jq -r '.secretValue.value' <<<"$AGGREGATE")" == "hush-hush-1234" ]] || { echo "secret value did not round-trip through the aggregate"; exit 1; }
          jq -e '.secretValue.secret == true' <<<"$AGGREGATE" >/dev/null || { echo "secret entry lost its marker"; exit 1; }
          [[ "$(jq -r '.structuredSecret.value.password' <<<"$AGGREGATE")" == "fixture-password-9876" ]] || { echo "structured secret did not round-trip through the aggregate"; exit 1; }
          jq -e '.plain.value == "hello" and .plain.secret == false' <<<"$AGGREGATE" >/dev/null || { echo "plain entry wrong"; exit 1; }
        env:
          PER_KEY_SECRET: ${{ steps.pulumijsonsecrets.outputs.secretValue }}
          AGGREGATE: ${{ steps.pulumijsonsecrets.outputs['stack-outputs'] }}
  test-resource-changes: # the opt-in flag must report which resources changed / were planned, even on failure, and error on a per-key name collision
    name: Resource Changes Round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/yaml
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Preview expected to fail (fresh stack + expect-no-changes)
        uses: ./
        id: previewfail
        # The GitHub Actions step property, so the job keeps running and the
        # assertions below can inspect the failed step — not this action's
        # continue-on-error input (pulumi's --continue-on-error).
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml
          expect-no-changes: true
          output-format: json
          resource-changes: changed
          suppress-progress: true
      - name: Assert the failed preview still reported the planned changes
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "expected the preview step to fail, got $OUTCOME"; exit 1; }
          jq -e 'any(.[]; .op == "create")' <<<"$RESOURCE_CHANGES" >/dev/null || { echo "failed preview lost its planned creates: '$RESOURCE_CHANGES'"; exit 1; }
        env:
          OUTCOME: ${{ steps.previewfail.outcome }}
          RESOURCE_CHANGES: ${{ steps.previewfail.outputs.resource-changes }}
      - name: Run Pulumi Up (json + resource-changes)
        uses: ./
        id: up
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml
          output-format: json
          resource-changes: changed
          suppress-progress: true
      - name: Run Pulumi Up again (per-key + resource-changes, no pending changes)
        uses: ./
        id: upnoop
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml
          resource-changes: changed
          suppress-progress: true
      - name: Assert changes are reported on the first up and empty on the no-op per-key up
        run: |
          jq -e 'any(.[]; .op == "create" and (.urn | contains("pulumi:pulumi:Stack")))' <<<"$CHANGES_UP" >/dev/null || { echo "up did not report the stack create: '$CHANGES_UP'"; exit 1; }
          jq -e 'all(.[]; .op and .urn and .type)' <<<"$CHANGES_UP" >/dev/null || { echo "a change entry is missing op/urn/type: '$CHANGES_UP'"; exit 1; }
          [[ "$CHANGES_NOOP" == "[]" ]] || { echo "no-op up must report no changes: '$CHANGES_NOOP'"; exit 1; }
          [[ "$PLAIN_NOOP" == "hello" ]] || { echo "per-key outputs must still be published alongside resource-changes: '$PLAIN_NOOP'"; exit 1; }
        env:
          CHANGES_UP: ${{ steps.up.outputs.resource-changes }}
          CHANGES_NOOP: ${{ steps.upnoop.outputs.resource-changes }}
          PLAIN_NOOP: ${{ steps.upnoop.outputs.plain }}
      - name: Run Pulumi Up once more (resource-changes all, still a no-op)
        uses: ./
        id: upall
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml
          output-format: json
          resource-changes: all
          suppress-progress: true
      - name: Assert the full account reports the unchanged steps a no-op run has
        run: |
          jq -e 'length > 0 and all(.[]; .op == "same")' <<<"$CHANGES_ALL" >/dev/null || { echo "all-mode no-op must report only same steps: '$CHANGES_ALL'"; exit 1; }
          jq -e 'any(.[]; .urn | contains("pulumi:pulumi:Stack"))' <<<"$CHANGES_ALL" >/dev/null || { echo "all-mode must include the stack resource: '$CHANGES_ALL'"; exit 1; }
        env:
          CHANGES_ALL: ${{ steps.upall.outputs.resource-changes }}
      - run: pulumi stack init dev
        working-directory: .github/test-stacks/yaml-collision
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - name: Up expected to fail (per-key + a stack output named resource-changes)
        uses: ./
        id: collision
        # GitHub Actions step property again — the job must keep running so
        # the assertion below can inspect the failed step.
        continue-on-error: true
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml-collision
          resource-changes: changed
          suppress-progress: true
      - name: Assert the collision failed the action without publishing either output
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "expected the collision to fail the action, got $OUTCOME"; exit 1; }
          [[ -z "$RESOURCE_CHANGES" ]] || { echo "colliding resource-changes output must not be published: '$RESOURCE_CHANGES'"; exit 1; }
        env:
          OUTCOME: ${{ steps.collision.outcome }}
          RESOURCE_CHANGES: ${{ steps.collision.outputs.resource-changes }}
  test-error-log: # the opt-in flag must transport the engine's error records so a dry-run consumer can tell "red only because of protections" from a genuine error
    name: Error Log Round-trip
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: not-a-secret
    steps:
      - uses: actions/checkout@v7
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/protected
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - run: npm install --no-audit --no-fund
        working-directory: .github/test-stacks/protected
      # Failure with no engine-event cause: --expect-no-changes fails via CLI
      # stderr only, so the error log must stay [] — the documented reason a
      # consumer's protection-only check needs its `length > 0` half.
      - name: Preview expected to fail without an engine-event cause (expect-no-changes)
        uses: ./
        id: nocausepreview
        # The GitHub Actions step property, so the job keeps running and the
        # assertions below can inspect the failed step — not this action's
        # continue-on-error input (pulumi's --continue-on-error).
        continue-on-error: true
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/protected
          expect-no-changes: true
          output-format: json
          error-log: true
          suppress-progress: true
      - name: Assert the uncaptured cause yields an empty error log
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "expected the preview step to fail, got $OUTCOME"; exit 1; }
          [[ "$ERROR_LOG" == "[]" ]] || { echo "expect-no-changes emits no engine error event, got: '$ERROR_LOG'"; exit 1; }
        env:
          OUTCOME: ${{ steps.nocausepreview.outcome }}
          ERROR_LOG: ${{ steps.nocausepreview.outputs['error-log'] }}
      - name: Up to seed the protected resource
        uses: ./
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/protected
          output-format: json
          suppress-progress: true
      - name: Drop the protected resource from the program
        run: pulumi config set protectedtest:guarded false --stack dev
        working-directory: .github/test-stacks/protected
      - name: Preview expected to fail on the refused protected delete
        uses: ./
        id: protectedpreview
        # Step property again — see above.
        continue-on-error: true
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/protected
          output-format: json
          error-log: true
          resource-changes: changed
          suppress-progress: true
      - name: Assert the refusal arrives uninterpreted and the consumer-side check works
        # The action ships the error records as data; classification is the
        # consumer's job. This assertion IS the documented consumer pattern:
        # drop the engine's closing summary, then pattern-match the causes.
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "expected the preview step to fail, got $OUTCOME"; exit 1; }
          jq -e 'all(.kind == "diagnostic" or .kind == "op-failed")' <<<"$ERROR_LOG" >/dev/null || { echo "every entry must carry its engine event kind, got: '$ERROR_LOG'"; exit 1; }
          causes=$(jq '[.[] | select((.message // "") | test("^(preview|update|refresh|destroy) failed\\s*$") | not)]' <<<"$ERROR_LOG")
          jq -e 'length > 0 and all((.message // "") | test("protect"; "i") and test("delet"; "i"))' <<<"$causes" >/dev/null || { echo "expected only protection refusals after dropping the summary, got: '$causes'"; exit 1; }
          jq -e 'any(.[]; .urn // "" | endswith("::guarded"))' <<<"$causes" >/dev/null || { echo "the refusal must carry the structured urn of the protected resource, got: '$causes'"; exit 1; }
          jq -e 'any(.[]; .op == "delete" and (.urn | endswith("::guarded")))' <<<"$RESOURCE_CHANGES" >/dev/null || { echo "resource-changes must carry the planned delete, got: '$RESOURCE_CHANGES'"; exit 1; }
        env:
          OUTCOME: ${{ steps.protectedpreview.outcome }}
          ERROR_LOG: ${{ steps.protectedpreview.outputs['error-log'] }}
          RESOURCE_CHANGES: ${{ steps.protectedpreview.outputs.resource-changes }}
      - name: Make the program itself fail
        run: pulumi config set protectedtest:boom true --stack dev
        working-directory: .github/test-stacks/protected
      - name: Preview expected to fail for a non-protection reason
        uses: ./
        id: brokenpreview
        # Step property again — see above.
        continue-on-error: true
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/protected
          output-format: json
          error-log: true
          suppress-progress: true
      - name: Assert the genuine error is captured and blocks the consumer-side check
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "expected the preview step to fail, got $OUTCOME"; exit 1; }
          causes=$(jq '[.[] | select((.message // "") | test("^(preview|update|refresh|destroy) failed\\s*$") | not)]' <<<"$ERROR_LOG")
          jq -e 'length > 0' <<<"$causes" >/dev/null || { echo "the program error must be captured, got: '$ERROR_LOG'"; exit 1; }
          jq -e 'all((.message // "") | test("protect"; "i") and test("delet"; "i")) | not' <<<"$causes" >/dev/null || { echo "a program error must not pass the protection pattern, got: '$causes'"; exit 1; }
        env:
          OUTCOME: ${{ steps.brokenpreview.outcome }}
          ERROR_LOG: ${{ steps.brokenpreview.outputs['error-log'] }}
      - run: pulumi stack init dev
        working-directory: .github/test-stacks/yaml-collision
      - name: Up expected to fail (per-key + a stack output named error-log)
        uses: ./
        id: errorlogcollision
        # Step property again — see above.
        continue-on-error: true
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          work-dir: .github/test-stacks/yaml-collision
          error-log: true
          suppress-progress: true
      - name: Assert the collision failed the action without publishing either output
        run: |
          [[ "$OUTCOME" == "failure" ]] || { echo "expected the collision to fail the action, got $OUTCOME"; exit 1; }
          [[ -z "$ERROR_LOG" ]] || { echo "colliding error-log output must not be published: '$ERROR_LOG'"; exit 1; }
        env:
          OUTCOME: ${{ steps.errorlogcollision.outcome }}
          ERROR_LOG: ${{ steps.errorlogcollision.outputs['error-log'] }}
  test-update-plan: # make sure the action works on a clean machine without building
    name: Action Update Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: oldstable
      - run: |
          pulumi login --local
          pulumi stack init dev
        working-directory: .github/test-stacks/golang
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
      - uses: actions/setup-node@v6
        with:
          node-version-file: 'package.json'
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - name: Generate Update Plan via Pulumi Preview
        uses: ./
        if: always()
        id: pulumi-preview
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: preview
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          plan: /tmp/update-plan.json
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - name: Apply Update Plan via Pulumi Up
        uses: ./
        if: always()
        id: pulumi-up
        env:
          PULUMI_CONFIG_PASSPHRASE: not-a-secret
        with:
          command: up
          cloud-url: file://~
          stack-name: dev
          upsert: true
          work-dir: .github/test-stacks/golang
          config-map: "{name: {value: test, secret: false}}"
          plan: /tmp/update-plan.json
          suppress-progress: true
          log-verbosity: 6
          debug: true
      - run: echo 'The random string is `${{ steps.pulumi-up.outputs.name }}`'

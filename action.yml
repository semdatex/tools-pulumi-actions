name: 'Pulumi CLI Action'
author: Pulumi
description: Pulumi's GitHub Actions deploy apps and infrastructure to your cloud of choice, using just your favorite language and GitHub.
branding:
  icon: upload-cloud
  color: purple
inputs:
  command:
    description: 'Pulumi command to run, eg. up'
    required: false
  stack-name:
    description: 'Which stack you want to apply to, eg. dev'
    required: false
  pulumi-version:
    description: 'Install a specific version of the Pulumi CLI'
    required: false
  pulumi-version-file:
    description: 'File containing the version of the Pulumi CLI to install. Example: .pulumi.version'
    required: false
  work-dir:
    description: 'Location of your Pulumi files. Defaults to ./'
    required: false
    default: ./
  comment-on-pr:
    description: 'If true, a comment will be created with results'
    required: false
    default: 'false'
  comment-on-pr-number:
    description: 'Overrides the PR used to comment on'
    required: false
  comment-on-summary:
    description: 'If true, a comment on the GitHub step summary will be created'
    required: false
    default: 'false'
  github-token:
    description: 'Github Token'
    required: false
    default: ${{ github.token }}
  cloud-url:
    description: 'A cloud URL to log in to'
    required: false
  secrets-provider:
    description: 'The type of the provider that should be used to encrypt and decrypt secrets. Possible choices: default, passphrase, awskms, azurekeyvault, gcpkms, hashivault'
    required: false
  parallel:
    description: 'Allow P resource operations to run in parallel at once (1 for no parallelism). Defaults to unbounded.'
    required: false
  message:
    description: 'Optional message to associate with the update operation'
    required: false
  config-map:
    description: 'Config to use during the operations'
    required: false
  expect-no-changes:
    description: 'Return an error if any changes occur during this update'
    required: false
    default: 'false'
  diff:
    description: 'Display operation as a rich diff showing the overall change'
    required: false
    default: 'false'
  replace:
    description: 'Specify resources to replace. Multiple resources can be specified one per line'
    required: false
  exclude:
    description: 'Specify a single resource URN to ignore. Multiple resources can be specified one per line'
    required: false
  exclude-dependents:
    description: 'Allows ignoring of dependent targets discovered but not specified in exclude.'
    required: false
    default: 'false'
  target:
    description: 'Specify a single resource URN to update. Other resources will not be updated. Multiple resources can be specified one per line'
    required: false
  target-dependents:
    description: 'Allows updating of dependent targets discovered but not specified in target.'
    required: false
    default: 'false'
  policyPacks:
    description: 'Run one or more policy packs as part of this update.'
    required: false
  policyPackConfigs:
    description: 'Path to JSON file containing the config for the policy pack of the corresponding "--policy-pack" flag.'
    required: false
  refresh:
    description: 'Execute the operation with the `--refresh` option'
    required: false
    default: 'false'
  upsert:
    description: 'Create the stack if it currently does not exist'
    required: false
    default: 'false'
  remove:
    description: 'Delete the stack after a destroy operation'
    required: false
    default: 'false'
  edit-pr-comment:
    description: 'Edit previous PR comment instead of posting new one'
    required: false
    default: 'true'
  color:
    description: 'Colorize output. Choices are: always, never, raw, auto'
    required: false
    default: 'auto'
  exclude-protected:
    description: 'Skip destroying protected resources. Only valid when command is destroy.'
    required: false
    default: 'false'
  plan:
    description: 'Where to either save an Update Plan or read an Update Plan from'
    required: false
  suppress-outputs:
    description: 'Suppress display of stack outputs (in case they contain sensitive values).'
    required: false
    default: 'false'
  suppress-progress:
    description: 'Suppress display of periodic progress dots to limit logs length'
    required: false
    default: 'false'
  secret-masking:
    description: 'How secret stack outputs are masked in logs. `nested` (default) also masks every string and number leaf inside structured secret outputs; `exact` masks only the exact serialized value (the previous behavior).'
    required: false
    default: 'nested'
  output-format:
    description: 'How stack outputs are published as step outputs. per-key (default): one step output per stack output, exactly like upstream. json: no per-key outputs; instead one stack-outputs output, a JSON object {name: {value, secret}} in which secret values are omitted and never decrypted. json-with-secrets: like json, but secret entries carry their decrypted value (masked in logs; GitHub strips job outputs containing masked values, so consume it within the same job).'
    required: false
    default: 'per-key'
  resource-changes:
    description: 'If true, publish the resource-changes output: a JSON array [{op, urn, type}] of the resources the command changed (up/refresh/destroy) or planned to change (preview), excluding unchanged (same) and read steps. Works with any output-format; with per-key the action fails if the stack itself has an output named resource-changes. When the action fails the output is still set, best-effort, from the events received before the error.'
    required: false
    default: 'false'
  error-log:
    description: 'If true, publish the error-log output: a JSON array of the error records the command produced, exactly as the engine reported them — error diagnostics as {kind: diagnostic, urn?, message} (urn only when the engine provided it structurally) and failed steps as {kind: op-failed, op, urn, type}. The action does not interpret messages: the engine attaches no structured cause, so classification (e.g. recognizing protection refusals, or the engine''s bare closing "preview failed" summary, which is included) is the consumer''s job. Works with any output-format; with per-key the action fails if the stack itself has an output named error-log. When the action fails the output is still set, best-effort, from the events received before the error, so a dry-run step with the GitHub Actions step property continue-on-error: true can post-process an expected failure. An empty log on a failed command means the cause was not visible in engine events (e.g. --expect-no-changes fails via CLI stderr only).'
    required: false
    default: 'false'
  always-include-summary:
    description: 'If comments must be trimmed, trim them from the front. This ensures the resources summary is always included in the comment'
    required: false
    default: 'false'
  continue-on-error:
    description: 'Continue the update with the remaining resources even if one errors (passed through as pulumi up --continue-on-error). The command still fails afterwards. Not the GitHub Actions step property of the same name, which is what lets a job keep running past a failed step.'
    required: false
    default: 'false'
  log-verbosity:
    description: 'Enable verbose logging (1-11; >3 is very verbose)'
    required: false
  log-flow:
    description: 'Flow log settings to child processes (like plugins)'
    required: false
    default: 'false'
  debug:
    description: 'Print detailed debugging output during resource operations'
    required: false
    default: 'false'
outputs:
  output:
    description: Output from running command
  stack-outputs:
    description: 'JSON object of stack outputs, `{name: {value, secret}}`. Only set with the json output formats; secret values are omitted unless the format is json-with-secrets.'
  resource-changes:
    description: 'JSON array [{op, urn, type}] of the resources the command changed (up/refresh/destroy) or planned to change (preview), excluding unchanged (same) and read steps. Only set when the resource-changes input is true — then set even when the action fails, best-effort, from the events received before the error.'
  error-log:
    description: 'JSON array of the error records the command produced, exactly as the engine reported them: {kind: diagnostic, urn?, message} and {kind: op-failed, op, urn, type} entries in event order, uninterpreted. Only set when the error-log input is true — then set even when the action fails, best-effort, from the events received before the error. Empty on success and when the failure cause was not visible in engine events.'
runs:
  using: 'node24'
  main: 'dist/index.js'
